version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blocklist
      POSTGRES_PASSWORD: blocklist
      POSTGRES_DB: blocklist_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blocklist']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://blocklist:blocklist@postgres:5432/blocklist_db
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      API_KEY: ${API_KEY:-change-me-in-production}
      EXTERNAL_BLOCKLIST_SOURCE: https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/porn-only/hosts
      BLOCKLIST_CRON: '0 0 * * *'
      PORT: '3000'
    ports:
      - '${BACKEND_PORT:-3001}:3000'
    profiles:
      - default

volumes:
  pgdata:
